# ==============================================================================
# ENTERPRISES CRM — AWS EC2 PRODUCTION NGINX REVERSE PROXY CONFIGURATION
# ==============================================================================
# Target: AWS EC2 Single-Instance Deployment
# Architecture:
#   Public Internet (80/443) -> Nginx Reverse Proxy -> Fastify Backend (127.0.0.1:4000)
#   - Serves Static SPA Assets with long-lived immutable caching
#   - Dynamic /technician SPA manifest injection preserved via Fastify
#   - Proxies REST APIs (/api/v1/*) with 50MB payload support
#   - Proxies Socket.IO (/socket.io/*) with HTTP/1.1 WebSocket Upgrade headers
# ==============================================================================

# WebSocket Connection Upgrade Mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------------------------
# HTTP (Port 80): Automatic 301 Redirect to HTTPS + Let's Encrypt ACME Challenge
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Let's Encrypt / Certbot verification challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS (Port 443): SSL Termination, Security Hardening & Fastify Proxy
# ------------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # --------------------------------------------------------------------------
    # SSL Certificate & Private Key (Certbot default paths)
    # Replace 'example.com' with your production domain after running certbot.
    # For initial self-signed or pre-domain testing, point to installed certs.
    # --------------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/crm.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.example.com/privkey.pem;

    # Modern TLS Hardening (Mozilla Intermediate Recommendation)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Payload limits (Matches Fastify 50MB body limit for bulk data imports and backups)
    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Access and Error Logging
    access_log /var/log/nginx/enterprises-crm-access.log;
    error_log /var/log/nginx/enterprises-crm-error.log warn;

    # --------------------------------------------------------------------------
    # Static Assets: Direct Nginx delivery with 1-year immutable caching
    # --------------------------------------------------------------------------
    location /assets/ {
        alias /opt/enterprises-crm/apps/web/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Favicon and PWA Web Manifests
    location ~* \.(webmanifest|ico|png|jpg|jpeg|svg)$ {
        root /opt/enterprises-crm/apps/web/dist;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri @fastify_backend;
    }

    # Service Worker: Must always revalidate
    location ~* (sw\.js|workbox-.*\.js)$ {
        root /opt/enterprises-crm/apps/web/dist;
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --------------------------------------------------------------------------
    # Socket.IO Realtime Gateway: Live Technician Tracking & Admin Live Map
    # --------------------------------------------------------------------------
    location /socket.io/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable proxy buffering for realtime low-latency event delivery
        proxy_buffering off;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # REST APIs (/api/v1/*)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for reporting and bulk transaction operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # --------------------------------------------------------------------------
    # Application Root & SPA Routes
    # Proxies to Fastify which serves the SPA and injects technician manifest
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Named fallback location
    location @fastify_backend {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
